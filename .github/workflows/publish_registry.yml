name: Test and publish to Comfy Registry

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      publish:
        description: 'Publish a new Registry version after all checks pass'
        required: true
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: comfy-registry-${{ github.repository }}
  cancel-in-progress: false

jobs:
  publish:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: moss
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      COMFYUI_ROOT: ${{ github.workspace }}/ComfyUI
      MOSS_BEFORE_ROOT: ${{ github.workspace }}/moss-before
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          path: moss
      - name: Check out official MOSS reference
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: Comfy-Org/ComfyUI
          ref: 63be2f9b82ad0dac88a7ceaa28a9cf3154125a18
          path: ComfyUI
          persist-credentials: false
          sparse-checkout: comfy_extras/nodes_moss_image.py
          sparse-checkout-cone-mode: false
      - name: Check out published compatibility reference
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: d0f24cae69e0cb66a21bc44875349ea61d96c60b
          path: moss-before
          persist-credentials: false
          sparse-checkout: |
            __init__.py
            nodes.py
            prompt_builder.py
            krea_bridge.py
          sparse-checkout-cone-mode: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: '24'
      - name: Install publishing and CPU test tools
        run: python -m pip install --disable-pip-version-check comfy-cli==1.22.0 Pillow==12.3.0 ruff==0.15.15
      - name: Check Registry Python warnings
        run: python -m ruff check --select S102,E702 .
      - name: Run Python regression tests
        run: python -B -m unittest discover -s tests -p "test_*.py" -v
      - name: Run JavaScript regression and syntax tests
        run: |
          node --test tests/*.test.mjs
          for path in web/*.js web/*.mjs tests/*.mjs; do
            node --check "$path"
          done
      - name: Pack and verify tracked source
        run: |
          comfy --skip-prompt --no-enable-telemetry node pack
          python - <<'PY'
          from pathlib import Path
          import hashlib, subprocess, zipfile
          expected = subprocess.check_output(["git", "ls-files", "-z"]).decode().strip("\0").split("\0")
          with zipfile.ZipFile("node.zip") as archive:
              assert archive.testzip() is None
              assert set(archive.namelist()) == set(expected)
              for path in expected:
                  assert archive.read(path) == Path(path).read_bytes(), path
              workflows = sorted(p for p in archive.namelist() if p.startswith("examples/MOSS_BBOX_"))
              assert workflows == ["examples/MOSS_BBOX_DMD.json", "examples/MOSS_BBOX_Standard.json"]
          print("Verified", len(expected), "files against source")
          print("Archive SHA256:", hashlib.sha256(Path("node.zip").read_bytes()).hexdigest())
          PY
      - name: Check that this version has not been published
        if: github.event_name == 'workflow_dispatch' && inputs.publish
        run: |
          python - <<'PY'
          import json, tomllib, urllib.error, urllib.request
          from pathlib import Path
          project = tomllib.loads(Path("pyproject.toml").read_text())["project"]
          url = f"https://api.comfy.org/nodes/{project['name']}/versions/{project['version']}"
          try:
              urllib.request.urlopen(url, timeout=30)
          except urllib.error.HTTPError as error:
              if error.code != 404:
                  raise
          else:
              raise SystemExit("Version already exists; no publication attempted.")
          PY
      - name: Publish once
        if: github.event_name == 'workflow_dispatch' && inputs.publish
        env:
          REGISTRY_ACCESS_TOKEN: ${{ secrets.REGISTRY_ACCESS_TOKEN }}
        run: |
          if [ -z "$REGISTRY_ACCESS_TOKEN" ]; then
            echo "::error::REGISTRY_ACCESS_TOKEN is not configured."
            exit 1
          fi
          comfy --skip-prompt --no-enable-telemetry node publish --token "$REGISTRY_ACCESS_TOKEN"

